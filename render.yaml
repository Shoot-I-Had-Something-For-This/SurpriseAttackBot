# Render Web Service (free tier available).
# Background Workers are not free — use type: web + /health on $PORT.
services:
  - type: web
    name: surprise-attack-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python surprise_attack_bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Set these secrets in the Render dashboard (do not commit values):
      # DISCORD_TOKEN
      # SA_CHANNEL_ID
      # SUPABASE_URL
      # SUPABASE_SERVICE_ROLE_KEY
      # GEMINI_API_KEY (optional, screenshots)
      # SA_OPERATOR_ROLE_IDS (optional)
